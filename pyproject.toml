[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa-desktop"
version = "0.1.2"
description = "Private, local dictation and text-to-speech desktop app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dbus-next==0.2.3; sys_platform == 'linux'",
    "numpy==2.5.1",
    "PySide6==6.10.1",
    "sherpa-onnx==1.13.4",
    "sounddevice==0.5.3",
]

[project.urls]
Homepage = "https://github.com/codisfy/sherpa-dictate"
Issues = "https://github.com/codisfy/sherpa-dictate/issues"

[project.scripts]
sherpa = "sherpa_entry:main"

[tool.setuptools]
py-modules = ["sherpa_entry", "sherpa_dictate", "sherpa_read"]

[tool.setuptools.packages.find]
include = ["sherpa_app*"]
